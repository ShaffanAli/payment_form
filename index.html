<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <form action="">
    <h1 class="main_heading">Payment Form</h1>
    <hr>
    <h3>User Details</h3>
    <p>Name: <input type="text" name="name" required></p>
    <fieldset><p>
        Male <input type="radio" class="male" name="gender" id="male" required>
        Female <input type="radio" class="female" name="gender" id="female" required>
    </p></fieldset>
    <p>Address: <textarea name="address" id="address" cols="100" rows="5"></textarea>
    </p>
    <p>Email: <input type="email" id="email" required placeholder="example@gmail.com"></p>
    <p>Pincode: <input type="number" name="pincode" id="pincode" required placeholder="*****"></p>
    <hr>
    <h1>Payment Details</h1>
    <p>Card Type:
        <select name="card_type" id="card_type" required>
            <option value="">--select a card type--</option>
            <option value="MasterCard">Master Card</option>
            <option value="Visa">Visa</option>
        </select>
    </p>
    <p>
        Card Number <input type="number" name="cardnumber" id="cardnumber" required placeholder="xxxx-xxxx-xxxx-xxxx">
    </p>
    <p>
        Expiration Date: <input type="date" name="exp_date" id="exp_date" required>
    </p>
    <p>CVV <input type="password" name="cvv" id="cvv" required placeholder="CVV Password"></p>
    <input type="submit" value="Pwaynow">
    </form>
    </div>
</body>
</html>
